name: chomelo-stack

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-server-header
    environment:
      CHOMELO_ENVIRONMENT: production
      CHOMELO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chomelo}:${POSTGRES_PASSWORD:-chomelo}@db:5432/${POSTGRES_DB:-chomelo}
      CHOMELO_REDIS_URL: redis://redis:6379/0
      CHOMELO_WORKER_URL: http://worker:9000
      CHOMELO_PAYMENT_PROVIDER: ${CHOMELO_PAYMENT_PROVIDER:-wompi}
      CHOMELO_WOMPI_PAYMENT_LINK: ${CHOMELO_WOMPI_PAYMENT_LINK:-https://checkout.wompi.co/l/VPOS_yJJIDR}
      CHOMELO_ADD_TRACK_COOLDOWN_SECONDS: ${CHOMELO_ADD_TRACK_COOLDOWN_SECONDS:-1800}
      CHOMELO_ADD_TRACK_COST_CREDITS: ${CHOMELO_ADD_TRACK_COST_CREDITS:-5}
      CHOMELO_JWT_SECRET: ${CHOMELO_JWT_SECRET:?CHOMELO_JWT_SECRET debe definirse con un valor aleatorio}
      CHOMELO_WOMPI_EVENTS_SECRET: ${CHOMELO_WOMPI_EVENTS_SECRET:?CHOMELO_WOMPI_EVENTS_SECRET debe definirse}
      CHOMELO_CORS_ORIGINS: ${CHOMELO_CORS_ORIGINS:-["https://jukebox.chomelo.org"]}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8001:8000"
    restart: unless-stopped

  worker:
    build: ./worker
    command: uvicorn main:app --host 0.0.0.0 --port 9000
    environment:
      CHOMELO_ENVIRONMENT: production
      CHOMELO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chomelo}:${POSTGRES_PASSWORD:-chomelo}@db:5432/${POSTGRES_DB:-chomelo}
      CHOMELO_REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    command: npm run preview -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5175:5173"
    restart: unless-stopped

  admin:
    build:
      context: ./frontend
      args:
        VITE_ENTRY: admin
        VITE_API_URL: /api/v1
    command: npm run preview -- --host 0.0.0.0 --port 5174
    environment:
      VITE_ENTRY: admin
      VITE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5176:5174"
    restart: unless-stopped

networks:
  default:
    external: true
    name: chomelo-jukebox_default
